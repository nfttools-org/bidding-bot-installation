services:
  server:
    image: nfttools/bidding-bot-server-beta-single:beta-single
    platform: linux/amd64
    user: "1000:1000"
    restart: always
    ports:
      - "3003:3003"
    mem_limit: 5376m
    memswap_limit: 5376m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: "production"
      PORT: 3003
      NODE_OPTIONS: "--max-old-space-size=4352 --expose-gc"
      REDIS_NODES: '[{"host":"redis-master-1","port":6379},{"host":"redis-master-2","port":6380},{"host":"redis-master-3","port":6381}]'
      ALCHEMY_API_KEY: "Vt4-KnmnLA7XAlfDkeWij"
      MONGODB_URI: "mongodb://mongodb:27017/BIDDING_BOT"
      MONGO_MAX_POOL_SIZE: "100"
      MONGO_MIN_POOL_SIZE: "30"
      SERVER_IP: ${SERVER_IP}
      USERNAME: ${USERNAME}
      EMAIL: ${EMAIL}
      JWT_SECRET: "NFTTOOLS TO THE MOON"
      AXIOM_DATASET: "nft-bidding-bot"
      AXIOM_TOKEN: "xaat-30ecb9c3-ce16-42f6-b824-ba8ef5c50e7c"
      API_KEY: ${API_KEY}
      RATE_LIMIT: ${RATE_LIMIT}
      DEBUG: ${DEBUG}
      MARKETPLACE_WS_URL: wss://nfttools-ws-proxy.nfttools.io
      WS_PROXY_HTTP_URL: wss://nfttools-ws-proxy.nfttools.io
    depends_on:
      - mongodb
      - redis-master-1
      - redis-master-2
      - redis-master-3
      - redis-cluster-init
    networks:
      - default
      - redis-cluster
    volumes:
      - server_logs:/app/debug-logs
      - /dev/null:/app/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "service=bidding-bot-server"
      - "environment=production"

  client:
    image: nfttools/bidding-bot-client-beta-single:beta-single
    platform: linux/amd64
    restart: always
    mem_limit: 700m
    memswap_limit: 700m
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3001
      BODY_SIZE_LIMIT: 104857600
      ALCHEMY_API_KEY: "Vt4-KnmnLA7XAlfDkeWij"
      NEXT_PUBLIC_ALCHEMY_API_KEY: "Vt4-KnmnLA7XAlfDkeWij"
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      NEXT_PUBLIC_AXIOM_DATASET: "nft-bidding-bot"
      NEXT_PUBLIC_AXIOM_TOKEN: "xaat-30ecb9c3-ce16-42f6-b824-ba8ef5c50e7c"
      NEXT_PUBLIC_USERNAME: ${USERNAME}
      NEXT_PUBLIC_MONGODB_URI: "mongodb://mongodb:27017/BIDDING_BOT"
      NEXT_PUBLIC_JWT_SECRET: "NFTTOOLS TO THE MOON"
      NEXT_PUBLIC_SERVER_IP: ${SERVER_IP}
      NEXT_PUBLIC_EMAIL: ${EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - mongodb
      - server

  mongodb:
    image: "mongo:latest"
    container_name: "mongodb_container"
    command: mongod --wiredTigerCacheSizeGB 0.5
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cluster - 3 masters + 3 replicas (high availability production setup)
  redis-master-1:
    image: "redis:latest"
    container_name: "redis-master-1"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:16379:16379"
    volumes:
      - redis_master_1:/data
    networks:
      - redis-cluster
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "cluster", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-master-2:
    image: "redis:latest"
    container_name: "redis-master-2"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6380
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6380:6380"
      - "127.0.0.1:16380:16380"
    volumes:
      - redis_master_2:/data
    networks:
      - redis-cluster
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "cluster", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-master-3:
    image: "redis:latest"
    container_name: "redis-master-3"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6381
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6381:6381"
      - "127.0.0.1:16381:16381"
    volumes:
      - redis_master_3:/data
    networks:
      - redis-cluster
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "cluster", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-replica-1:
    image: "redis:latest"
    container_name: "redis-replica-1"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6382
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6382:6382"
      - "127.0.0.1:16382:16382"
    volumes:
      - redis_replica_1:/data
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-replica-2:
    image: "redis:latest"
    container_name: "redis-replica-2"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6383
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6383:6383"
      - "127.0.0.1:16383:16383"
    volumes:
      - redis_replica_2:/data
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-replica-3:
    image: "redis:latest"
    container_name: "redis-replica-3"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6384
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
      --tcp-keepalive 60
      --timeout 0
    ports:
      - "127.0.0.1:6384:6384"
      - "127.0.0.1:16384:16384"
    volumes:
      - redis_replica_3:/data
    networks:
      - redis-cluster
    restart: unless-stopped

  # Cluster initialization (one-time setup)
  redis-cluster-init:
    image: "redis:latest"
    container_name: "redis-cluster-init"
    command: >
      bash -c "
        echo 'Waiting for Redis nodes...'
        sleep 15
        echo 'Flushing all Redis nodes to clear existing data...'
        redis-cli -h redis-master-1 -p 6379 FLUSHALL || echo 'Failed to flush redis-master-1'
        redis-cli -h redis-master-2 -p 6380 FLUSHALL || echo 'Failed to flush redis-master-2'
        redis-cli -h redis-master-3 -p 6381 FLUSHALL || echo 'Failed to flush redis-master-3'
        redis-cli -h redis-replica-1 -p 6382 FLUSHALL || echo 'Failed to flush redis-replica-1'
        redis-cli -h redis-replica-2 -p 6383 FLUSHALL || echo 'Failed to flush redis-replica-2'
        redis-cli -h redis-replica-3 -p 6384 FLUSHALL || echo 'Failed to flush redis-replica-3'
        echo 'All nodes flushed. Creating cluster...'
        sleep 2
        redis-cli --cluster create redis-master-1:6379 redis-master-2:6380 redis-master-3:6381 redis-replica-1:6382 redis-replica-2:6383 redis-replica-3:6384 --cluster-replicas 1 --cluster-yes
        echo 'Production Redis Cluster initialized!'
      "
    depends_on:
      redis-master-1:
        condition: service_healthy
      redis-master-2:
        condition: service_healthy
      redis-master-3:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
      redis-replica-2:
        condition: service_started
      redis-replica-3:
        condition: service_started
    networks:
      - redis-cluster

volumes:
  mongodb_data:
  redis_master_1:
  redis_master_2:
  redis_master_3:
  redis_replica_1:
  redis_replica_2:
  redis_replica_3:
  server_logs:

networks:
  redis-cluster:
    driver: bridge
  default:
    driver: bridge
